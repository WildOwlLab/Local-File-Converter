name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # No conversion tools are installed here on purpose. Tests that shell out
      # to one skip themselves when it is absent, so this run proves the suite
      # is meaningful on a bare checkout -- which is what a new contributor has.
      - name: Run tests
        run: python -m pytest

  matrix-sweep:
    name: every route, for real
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            imagemagick ffmpeg pandoc calibre \
            libreoffice-writer libreoffice-calc libreoffice-impress

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run the full suite
        run: python -m pytest

      # The sweep that proves the advertised matrix is actually deliverable.
      # Routes the runner's own builds cannot perform skip themselves with a
      # named reason rather than failing.
      - name: Run the every-route sweep
        run: python -m pytest -m matrix -rs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .
