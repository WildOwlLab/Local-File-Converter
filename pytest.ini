[pytest]
testpaths = tests
# tests/ sits beside the modules it imports; conftest.py puts the project root
# on sys.path so `import main` works without packaging the app.
pythonpath = . tests
addopts = -q --strict-markers -m "not matrix"
markers =
    matrix: the exhaustive every-route sweep. Minutes, not seconds, and needs
        all five tools, so it is excluded from the default run. Opt in with
        `pytest -m matrix`.
