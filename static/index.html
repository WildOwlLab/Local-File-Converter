<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local File Converter</title>
<!-- Inline so the browser stops asking for /favicon.ico, which the app
     does not serve and which shows up as a 404 in the console. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%94%81%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="shell">

  <header class="head">
    <h1>Local File Converter</h1>
    <p class="sub">Files are converted on this machine. Nothing is uploaded anywhere.</p>
  </header>

  <div id="tool-banner" class="banner warn" hidden></div>

  <section id="drop" class="drop" tabindex="0" role="button"
           aria-label="Choose a file to convert">
    <svg class="drop-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 16V4m0 0L8 8m4-4 4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
    </svg>
    <p class="drop-title">Drop a file here</p>
    <p class="drop-hint">or click to choose one</p>
    <input type="file" id="file-input" hidden>
  </section>

  <section id="file-card" class="card" hidden>
    <div class="file-row">
      <div class="file-meta">
        <p class="file-name" id="file-name"></p>
        <p class="file-detail"><span id="file-type"></span> · <span id="file-size"></span></p>
      </div>
      <button type="button" class="link-btn" id="reset-btn">Choose another</button>
    </div>
    <p id="mismatch" class="banner warn inline" hidden></p>
  </section>

  <section id="picker" class="card" hidden>
    <label class="label" for="target">Convert to</label>
    <div class="picker-row">
      <select id="target"></select>
      <button type="button" id="convert-btn" class="primary">Convert</button>
    </div>
    <p class="hint" id="chain-note" hidden></p>
  </section>

  <section id="progress-card" class="card" hidden>
    <div class="progress-head">
      <span id="stage">Working…</span>
      <span id="pct"></span>
    </div>
    <div class="track"><div id="bar" class="bar"></div></div>
  </section>

  <section id="result" class="card ok" hidden>
    <p class="result-title">Done</p>
    <p class="result-name" id="result-name"></p>
    <a id="download" class="primary as-link" download>Download</a>
  </section>

  <section id="error" class="card bad" hidden>
    <p class="result-title">Conversion failed</p>
    <p id="error-summary"></p>
    <details id="error-details" hidden>
      <summary>Details</summary>
      <pre id="error-body"></pre>
    </details>
  </section>

</main>
<script src="/app.js"></script>
</body>
</html>
